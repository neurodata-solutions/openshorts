services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
      - openshorts_runtime_data:/data
    environment:
      # /app is bind-mounted from the host (owned by the host user), but the
      # container runs as non-root appuser (uid 999) — it can't write there.
      # Route writable runtime state to a named volume instead.
      - YOLO_MODEL_PATH=/data/yolov8n.pt
      - MPLCONFIGDIR=/data/mplconfig
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "127.0.0.1:5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  openshorts_runtime_data:
